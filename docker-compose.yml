services:
  ielts-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ielts-practice-app
    ports:
      - "3000:3000"
    environment:
      # CLAUDE_CODE_OAUTH_TOKEN and CLAUDE_MODEL come from env_file (.env.local).
      # Do NOT re-declare them here: `environment` entries interpolate from the
      # shell (usually unset → "") and would override the env_file values.
      - NODE_ENV=production
    env_file:
      - .env.local
    # Agent SDK writes per-request session transcripts under CLAUDE_CONFIG_DIR;
    # keep them on tmpfs so the container doesn't slowly fill its disk layer.
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
